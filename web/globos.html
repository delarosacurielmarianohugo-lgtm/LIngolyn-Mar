<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lingolyn - Validando Insignia</title>
  
  <link rel="stylesheet" href="estilos.css">

  <style>
    .main {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      min-height: 60vh;
      box-sizing: border-box;
    }

    .contenedor-errores {
      position: absolute;
      top: 20px;
      left: 40px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 5px;
    }

    .label-errores {
      font-size: 18px;
      color: #000;
      margin: 0;
    }

    .box-errores {
      background: #fff;
      border: 1px solid #000;
      font-size: 16px;
      padding: 6px 0;
      width: 90px;
      text-align: center;
      box-sizing: border-box;
    }

    .felicitacion-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 20px;
      width: 100%;
      max-width: 650px;
    }

    .texto-validacion {
      font-size: 24px;
      color: #000;
      margin: 0;
    }

    .texto-felicidades {
      font-size: 26px;
      color: #000;
      margin: 0 0 10px 0;
    }

    .box-globos {
      width: 180px;
      height: auto;
      margin: 10px 0;
    }

    .box-globos img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: contain;
    }

    .texto-continua {
      font-size: 24px;
      color: #000;
      margin: 10px 0 10px 0;
    }

    .btn-regresar {
      background: #f7a8b8; 
      color: #fff;
      border: 1px solid #000;
      padding: 10px 55px;
      font-size: 18px;
      cursor: pointer;
      border-radius: 4px;
      font-weight: bold;
      transition: background 0.2s, transform 0.1s;
    }

    .btn-regresar:hover {
      background: #e593a3;
    }

    .btn-regresar:active {
      transform: scale(0.98);
    }

    @media (max-width: 600px) {
      .contenedor-errores {
        position: static;
        margin-bottom: 20px;
        align-items: center;
      }
    }
  </style>
</head>
<body>

 <div>
   <div class="rosa">
      <img src="logo.png" alt="Abeja">
      <h1>Lingolyn</h1> 
  </div>

  <div class="navbar">
    <a href="registro.html">LOGIN</a>
    <a href="perfil.html">PERFIL</a>
    <a href="administrar.html">ADMINISTRAR</a>
    <a href="Insignias.html">INSIGNIAS</a>
    <a href="basedeaprendizaje.html">BASE DE APRENDIZAJE</a>
    <a href="vocabulario.html">VOCABULARIO</a>
    <a href="ahorcado.jsp">AHORCADO</a>
    <a href="tradicional.html">MODALIDAD TRADICIONAL</a>
    <a href="precision.jsp">PRECISION</a>
  </div>
        </div>

  <div class="main">
    
    <div class="felicitacion-container">
      <h3 class="texto-validacion">Validando insignia....</h3>
      <h2 class="texto-felicidades">Felicidades!! Has obtenido una nueva insignia</h2>
      
      <div class="box-globos">
        <img src="globos.png" alt="Globos de celebración">
      </div>
      
      <p class="texto-continua">Continua aprendiendo</p>
      
<button class="btn-aceptar" onclick="window.location.href='index.html';">Aceptar</button>
    </div>

  </div>
              <div class="footer-simple"></div>

</body>
</html>
