<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lingolyn - Insignias</title>
  
  <link rel="stylesheet" href="estilos.css">

  <style>
    .insignias-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      gap: 25px;
    }

    .titulo-insignias {
      font-size: 28px;
      font-weight: normal;
      color: #000;
      margin: 10px 0 10px 0;
      text-align: center;
    }

    .grid-insignias {
      display: grid;
      grid-template-columns: repeat(3, 1fr); 
      gap: 30px 40px;                                 
      justify-items: center;                  
      align-items: center;
      width: 100%;
      margin-bottom: 15px;
    }

    .box-insignia {
      width: 100%;
      max-width: 220px;                      
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Control de las imágenes */
    .box-insignia img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: contain;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    .box-insignia img:hover {
      transform: scale(1.05);
    }

    .btn-aceptar {
      background: #f7a8b8; 
      color: #fff;
      border: 1px solid #000;
      padding: 12px 65px;
      font-size: 22px;
      cursor: pointer;
      border-radius: 4px;
      font-weight: bold;
      transition: background 0.2s;
    }

    .btn-aceptar:hover {
      background: #e593a3;
    }

    @media (max-width: 768px) {
      .grid-insignias {
        grid-template-columns: repeat(2, 1fr);
      }
    }
    @media (max-width: 480px) {
      .grid-insignias {
        grid-template-columns: 1fr;
      }
    }

    /* --- NUEVOS ESTILOS PARA LA ADMINISTRACIÓN (CRUD) --- */
    .crud-panel {
      width: 100%;
      background-color: #f9f9f9;
      border: 2px dashed #f7a8b8;
      border-radius: 8px;
      padding: 20px;
      margin-top: 15px;
      box-sizing: border-box;
      text-align: center;
    }

    .crud-title {
      font-size: 22px;
      color: #333;
      margin-bottom: 15px;
      font-weight: bold;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      font-size: 16px;
      margin: 0 10px;
      cursor: pointer;
    }

    .select-style {
      padding: 8px;
      font-size: 16px;
      width: 250px;
      border-radius: 4px;
      border: 1px solid #ccc;
    }

    .btn-crud {
      background: #bae1ff;
      color: #000;
      border: 1px solid #000;
      padding: 10px 30px;
      font-size: 16px;
      cursor: pointer;
      border-radius: 4px;
      font-weight: bold;
      margin: 5px;
      transition: background 0.2s;
    }

    .btn-crud:hover {
      background: #a2cfec;
    }
  </style>
</head>
<body>

        <div>
   <div class="rosa">
      <img src="logo.png" alt="Abeja">
      <h1>Lingolyn</h1> 
  </div>

  <div class="navbar">
    <a href="registro.html">LOGIN</a>
    <a href="perfil.html">PERFIL</a>
    <a href="administrar.html">ADMINISTRAR</a>
    <a href="Insignias.html">INSIGNIAS</a>
    <a href="basedeaprendizaje.html">BASE DE APRENDIZAJE</a>
    <a href="vocabulario.html">VOCABULARIO</a>
    <a href="ahorcado.jsp">AHORCADO</a>
    <a href="tradicional.html">MODALIDAD TRADICIONAL</a>
    <a href="precision.jsp">PRECISION</a>
  </div>
        </div>

  <div class="main">
    
    <div class="insignias-container">
      
      <h2 class="titulo-insignias">Selecciona la insignia alcanzada</h2>
      
      <div class="grid-insignias">
        <div class="box-insignia">
          <img src="insignia1.png" alt="Memoria de Elefante">
        </div>
        <div class="box-insignia">
          <img src="Insignia2.png" alt="Leyenda del Panal">
        </div>
        <div class="box-insignia">
          <img src="Insignia3.png" alt="Guardián del Diccionario">
        </div>
        <div class="box-insignia">
          <img src="Insignia4.png" alt="Recolector de Miel">
        </div>
        <div class="box-insignia">
          <img src="Insignia5.png" alt="Jardín de Logros">
        </div>
        <div class="box-insignia">
          <img src="Insignia.png" alt="Relámpago de Velocidad">
        </div>
      </div>
      
      <button class="btn-aceptar" onclick="window.location.href='datos.html';">Aceptar</button>

      <div class="crud-panel">
        <div class="crud-title">Administrar Mis Listas de Insignias</div>
        
        <form action="procesarInsignias.jsp" method="POST">
          
          <div class="form-group">
            <label for="insigniaSeleccionada"><strong>Insignia:</strong></label>
            <select name="insigniaSeleccionada" id="insigniaSeleccionada" class="select-style" required>
              <option value="" disabled selected>-- Elige una insignia --</option>
              <option value="Memoria de Elefante">Memoria de Elefante</option>
              <option value="Leyenda del Panal">Leyenda del Panal</option>
              <option value="Guardián del Diccionario">Guardián del Diccionario</option>
              <option value="Recolector de Miel">Recolector de Miel</option>
              <option value="Jardín de Logros">Jardín de Logros</option>
              <option value="Relámpago de Velocidad">Relámpago de Velocidad</option>
            </select>
          </div>

          <div class="form-group">
            <strong>Clasificar como:</strong>
            <label>
              <input type="radio" name="categoria" value="Favorita" checked> Favorita
            </label>
            <label>
              <input type="radio" name="categoria" value="Meta"> Meta por alcanzar
            </label>
          </div>

          <div class="form-group">
            <button type="submit" name="accion" value="agregar" class="btn-crud" style="background-color: #baffc9;">Agregar a Lista</button>
            <button type="submit" name="accion" value="eliminar" class="btn-crud" style="background-color: #ffb3ba;">Quitar de Lista</button>
            <button type="submit" name="accion" value="consultar" class="btn-crud">Ver Mis Listas</button>
          </div>

        </form>
      </div>
      </div>

  </div>
    <div class="footer-simple"></div>
</body>
</html>
